<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />

  <!-- Subtle tech pattern circles -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(45, 212, 191, 0.15)" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(129, 140, 248, 0.15)" stroke-width="2" />

  <!-- Stylized person silhouette / avatar icon -->
  <g transform="translate(0, 15)">
    <!-- Head -->
    <circle cx="200" cy="150" r="58" fill="#e2e8f0" />
    <!-- Glasses / Modern dev touch -->
    <rect x="165" y="145" width="28" height="18" rx="5" fill="#0f172a" />
    <rect x="207" y="145" width="28" height="18" rx="5" fill="#0f172a" />
    <line x1="193" y1="154" x2="207" y2="154" stroke="#0f172a" stroke-width="3" />
    
    <!-- Hair / stylish shape -->
    <path d="M 142 145 C 142 95, 258 95, 258 145 C 245 125, 215 115, 200 115 C 185 115, 155 125, 142 145 Z" fill="#0f172a" />

    <!-- Smiling subtle expression -->
    <path d="M 186 182 Q 200 193 214 182" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Shoulders / Torso with stylish hoodie -->
    <path d="M 110 320 C 110 240, 150 230, 200 230 C 250 230, 290 240, 290 320 Z" fill="url(#accentGrad)" />
    <!-- Shirt inner collar -->
    <polygon points="175,230 225,230 200,265" fill="#0f172a" />
  </g>

  <!-- Developer code badge floating on bottom right -->
  <g transform="translate(265, 265)">
    <circle cx="35" cy="35" r="35" fill="#0f172a" stroke="#2dd4bf" stroke-width="3" />
    <text x="35" y="42" font-family="monospace" font-size="20" font-weight="bold" fill="#2dd4bf" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
